name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # 确定性断言全量跑（Golden 评估层默认排除，避免 LLM 成本；-Peval 手动触发）
      - name: Maven test
        run: ./mvnw -q -pl shang-customerservice -am test

  frontend-mall:
    name: Mall frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shang-mall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shang-mall/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build

  frontend-admin:
    name: Admin frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shang-admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shang-admin-web/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
