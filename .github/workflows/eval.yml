name: eval

on:
  schedule:
    # 每周日 02:00 Asia/Shanghai（周六 18:00 UTC）
    - cron: "0 18 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: shang
          POSTGRES_USER: shang
          POSTGRES_PASSWORD: shang
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shang -d shang"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/shang?sslmode=disable&stringtype=unspecified&connectTimeout=5&socketTimeout=30&tcpKeepAlive=true
      DB_USERNAME: shang
      DB_PASSWORD: shang
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: 5672
      SERVER_PORT: 8086
      MANAGEMENT_PORT: 8087
      JWT_SECRET: shang-pivot-eval-jwt-secret-32bytes-min!!
      # 评估不涉及文件上传，但 MinioClient 初始化要求凭据非空；与 nightly 保持一致
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: shang-pivot
      # 执行模型（被测 Agent）：V24 已清空 DB 里的占位符，环境变量才会生效
      LLM_BASE_URL: https://wb2api.yingyue.cloud/v1
      LLM_MODEL: cn:deepseek-v4.1-flash
      LLM_API_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
      # 向量检索：与生产一致（SiliconFlow bge-m3, 1024 维）
      LLM_EMBEDDING_BASE_URL: https://api.siliconflow.cn/v1
      LLM_EMBEDDING_MODEL: BAAI/bge-m3
      LLM_EMBEDDING_DIM: "1024"
      LLM_EMBEDDING_API_KEY: ${{ secrets.EVAL_EMBEDDING_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 构建后端
        working-directory: backend
        run: ./mvnw -q -DskipTests -pl shang-server -am package

      - name: 启动后端
        working-directory: backend
        run: |
          nohup java -jar shang-server/target/shang-server-0.0.1-SNAPSHOT.jar \
            > /tmp/backend.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8086/api/site/brand >/dev/null 2>&1; then
              echo "backend ready"; exit 0
            fi
            sleep 1
          done
          echo "backend failed"; tail -100 /tmp/backend.log; exit 1

      - name: 重建商品与知识索引
        run: |
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8086/admin/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Admin@123"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["accessToken"])')
          echo "admin token ok"
          echo "-- product index --"
          curl -fsS -X POST http://127.0.0.1:8086/admin/customer-service/product-index/rebuild \
            -H "Authorization: Bearer $TOKEN"; echo
          echo "-- knowledge index --"
          curl -fsS -X POST http://127.0.0.1:8086/admin/customer-service/knowledge-docs/rebuild \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -d '{"full":true}'; echo

      - name: Golden 评估（20 用例 + 裁判）
        working-directory: backend
        env:
          EVAL_TARGET_BASE_URL: http://127.0.0.1:8086
          EVAL_CUSTOMER_PHONES: "13900009999,13900009998"
          EVAL_LLM_BASE_URL: https://wb2api.yingyue.cloud/v1
          EVAL_LLM_MODEL: cn:deepseek-v4.1-flash
          EVAL_LLM_API_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
          # 确定性断言全过是硬门禁；裁判分只卡平均分下限，避免单例波动误红
          EVAL_JUDGE_BLOCKING: "false"
          EVAL_JUDGE_MIN_AVG: "0.7"
        run: >
          ./mvnw -q -pl shang-customerservice -am -Peval
          -Dtest=AgentEvalReportTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: 上传评估报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: backend/shang-customerservice/target/eval-report.md
          if-no-files-found: warn

      - name: 失败时输出后端日志
        if: failure()
        run: tail -120 /tmp/backend.log || true
