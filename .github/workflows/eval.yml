name: eval

on:
  schedule:
    # 每周日 02:00 Asia/Shanghai（周六 18:00 UTC）
    - cron: "0 18 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: shang
          POSTGRES_USER: shang
          POSTGRES_PASSWORD: shang
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shang -d shang"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/shang?sslmode=disable&stringtype=unspecified&connectTimeout=5&socketTimeout=30&tcpKeepAlive=true
      DB_USERNAME: shang
      DB_PASSWORD: shang
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: 5672
      SERVER_PORT: 8086
      MANAGEMENT_PORT: 8087
      JWT_SECRET: shang-pivot-eval-jwt-secret-32bytes-min!!
      # 评估不涉及文件上传，但 MinioClient 初始化要求凭据非空；与 nightly 保持一致
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: shang-pivot
      # V3.1 图编排（与生产一致）；回退时改 legacy
      AGENT_ENGINE: graph
      AGENT_LLM_CLIENT: legacy
      # 平台自动套件（secrets 未配置时该步骤自动跳过）
      PLATFORM_BASE_URL: https://agent.bettery.cn
      PLATFORM_EMAIL: ${{ secrets.PLATFORM_EMAIL }}
      PLATFORM_PASSWORD: ${{ secrets.PLATFORM_PASSWORD }}
      PLATFORM_PROJECT: ecommerce
      PLATFORM_TARGETS: AT-CA66D70EFB,AT-0B7DEB56CD
      PLATFORM_SUITE: v36-refcart-auto
      # 执行模型（被测 Agent）：V24 已清空 DB 里的占位符，环境变量才会生效
      LLM_BASE_URL: https://wb2api.yingyue.cloud/v1
      LLM_MODEL: cn:deepseek-v4.1-flash
      LLM_API_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
      # 向量检索：与生产一致（SiliconFlow bge-m3, 1024 维）
      LLM_EMBEDDING_BASE_URL: https://api.siliconflow.cn/v1
      LLM_EMBEDDING_MODEL: BAAI/bge-m3
      LLM_EMBEDDING_DIM: "1024"
      LLM_EMBEDDING_API_KEY: ${{ secrets.EVAL_EMBEDDING_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 构建后端
        working-directory: backend
        run: ./mvnw -q -DskipTests -pl shang-server -am package

      - name: 启动后端
        working-directory: backend
        run: |
          nohup java -jar shang-server/target/shang-server-0.0.1-SNAPSHOT.jar \
            > /tmp/backend.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8086/api/site/brand >/dev/null 2>&1; then
              echo "backend ready"; exit 0
            fi
            sleep 1
          done
          echo "backend failed"; tail -100 /tmp/backend.log; exit 1

      - name: 重建商品与知识索引
        run: |
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8086/admin/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Admin@123"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["accessToken"])')
          echo "admin token ok"
          echo "-- product index --"
          curl -fsS -X POST http://127.0.0.1:8086/admin/customer-service/product-index/rebuild \
            -H "Authorization: Bearer $TOKEN"; echo
          echo "-- knowledge index --"
          curl -fsS -X POST http://127.0.0.1:8086/admin/customer-service/knowledge-docs/rebuild \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -d '{"full":true}'; echo

      - name: 参考用例脚本单测
        run: python3 -m unittest discover -s scripts/eval/tests -v

      - name: 目录驱动用例 + 覆盖率门禁
        env:
          SHANG_BASE_URL: http://127.0.0.1:8086
          SHANG_ADMIN_PASSWORD: Admin@123
        run: |
          OUT=backend/shang-server/target/reference
          mkdir -p "$OUT"
          python3 scripts/eval/catalog_snapshot.py \
            --base-url "$SHANG_BASE_URL" --out "$OUT/catalog.json"
          python3 scripts/eval/generate_reference_cases.py \
            --catalog "$OUT/catalog.json" --out "$OUT/reference-cart-auto.jsonl"
          python3 scripts/eval/check_reference_coverage.py \
            --catalog "$OUT/catalog.json" --dataset "$OUT/reference-cart-auto.jsonl" \
            --report "$OUT/reference-coverage.md"
          python3 scripts/eval/mine_failure_candidates.py \
            --host 127.0.0.1 --port 5432 --database shang --user shang --password shang \
            --out "$OUT/reference-candidates.jsonl" || true
          python3 scripts/eval/reference_health.py \
            --host 127.0.0.1 --port 5432 --database shang --user shang --password shang \
            --out "$OUT/reference-health.md" || true

      - name: 上传覆盖率与候选样本
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-coverage-${{ github.run_id }}
          path: backend/shang-server/target/reference/
          if-no-files-found: warn

      - name: 同步并运行平台自动套件
        if: env.PLATFORM_EMAIL != ''
        run: |
          OUT=backend/shang-server/target/reference
          python3 scripts/eval/sync_platform_cases.py \
            --dataset "$OUT/reference-cart-auto.jsonl" \
            --target AT-CA66D70EFB --target AT-0B7DEB56CD
          python3 scripts/eval/run_platform_suite.py --suite "$PLATFORM_SUITE"

      - name: Golden 评估（200 用例 + graph 路径 + 裁判趋势）
        working-directory: backend
        env:
          EVAL_TARGET_BASE_URL: http://127.0.0.1:8086
          # 3 个评估账号轮换，避免 20 条/5 分钟的用户级限流
          EVAL_CUSTOMER_PHONES: "13900009999,13900009998,13900009997"
          EVAL_DATASET_VERSION: "v32-200"
          EVAL_LLM_BASE_URL: https://wb2api.yingyue.cloud/v1
          EVAL_LLM_MODEL: cn:deepseek-v4.1-flash
          EVAL_LLM_API_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
          # 确定性断言全过是硬门禁；裁判分在 CI 仅记录趋势（模型发挥波动大）
          EVAL_JUDGE_GATE: "false"
          EVAL_JUDGE_MIN_AVG: "0.7"
        run: >
          ./mvnw -q -pl shang-customerservice -am -Peval
          -Dtest=AgentEvalReportTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: 上传评估报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: backend/shang-customerservice/target/eval-report.md
          if-no-files-found: warn

      - name: 失败时输出后端日志
        if: failure()
        run: tail -120 /tmp/backend.log || true
